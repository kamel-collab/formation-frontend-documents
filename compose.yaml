name: formation-frontend

services:
  web:
    image: caddy:2-alpine
    ports:
      - "127.0.0.1:8089:80"
    volumes:
      - ./index.html:/srv/index.html:ro
      - ./assets:/srv/assets:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - laravel

networks:
  laravel:
    external: true
    name: ${BACKEND_NETWORK:-formation-laravel_default}
